name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ClipKey.xcodeproj \
            -scheme ClipKey \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Check keyboard dictionary
        run: test -s build/Build/Products/Release-iphoneos/ClipKey.app/PlugIns/ClipKeyboard.appex/ko_dict.txt

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ClipKey.app Payload/
          zip -qry ClipKey.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ClipKey-ipa
          path: ClipKey.ipa
