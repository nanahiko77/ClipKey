name: Build IPA

# 빌드는 직접 실행할 때만 돈다 (Actions > Build IPA > Run workflow, 또는 gh workflow run).
# 빌드가 끝나면 GitHub 릴리스에 ipa 와 SideStore 소스(source.json)를 올린다.
# SideStore 에 아래 소스 주소를 한 번 등록해 두면 새 빌드가 업데이트로 뜬다.
#   https://github.com/nanahiko77/ClipKey/releases/latest/download/source.json
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      # 빌드 번호는 실행 번호를 쓴다. 매번 커지므로 SideStore 가 새 버전으로 알아본다.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        # 실패하면 컴파일 오류를 주석(annotation)으로 남긴다 (로그를 못 받는 곳에서도 볼 수 있게)
        run: |
          set -o pipefail
          xcodebuild \
            -project ClipKey.xcodeproj \
            -scheme ClipKey \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log || {
              grep -E "error:" xcodebuild.log | sort -u | head -30 | while IFS= read -r line; do echo "::error::$line"; done
              exit 65
            }

      - name: Check keyboard dictionary
        run: test -s build/Build/Products/Release-iphoneos/ClipKey.app/PlugIns/ClipKeyboard.appex/ko_dict.txt

      - name: Check version numbers
        # 앱과 키보드의 빌드 번호가 실행 번호와 같아야 SideStore 가 업데이트를 받아들인다
        run: |
          APP=build/Build/Products/Release-iphoneos/ClipKey.app
          for p in "$APP/Info.plist" "$APP/PlugIns/ClipKeyboard.appex/Info.plist"; do
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$p")
            echo "$p -> $(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$p") ($v)"
            test "$v" = "$BUILD_NUMBER"
          done

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ClipKey.app Payload/
          zip -qry ClipKey.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ClipKey-ipa
          path: ClipKey.ipa

      - name: Publish release and SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}-${BUILD_NUMBER}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases"
          SIZE=$(stat -f%z ClipKey.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES=$(git log -1 --pretty=%s)
          # 소스·앱 아이콘은 늘 앱 아이콘에서 만든다 (빌드마다 주소가 달라 SideStore 가 새 아이콘을 받는다)
          sips -Z 512 App/Assets.xcassets/AppIcon.appiconset/icon-1024.png --out icon.png
          cp icon.png docs/icon.png
          python3 tools/make_source.py "$VERSION" "$BUILD_NUMBER" "$DATE" \
            "$BASE/download/$TAG/ClipKey.ipa" "$SIZE" "$BASE/download/$TAG/icon.png" "$NOTES" > source.json
          gh release create "$TAG" ClipKey.ipa source.json icon.png \
            --title "ClipKey $VERSION ($BUILD_NUMBER)" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
